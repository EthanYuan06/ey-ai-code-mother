spring:
  application:
    name: ey-ai-code-mother
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_mother
    username: root
    password: 1234
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
# http://localhost:8123/api/doc.html
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuluo.eyaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 关闭自动转换，项目已将实体类字段和数据库字段均采用驼峰命名
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
