# =============================================
# Docker 部署环境专用配置
# 激活方式 SPRING_PROFILES_ACTIVE=docker
# 覆盖 application.yml 中的本地开发配置
# =============================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:code_mother}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Docker 环境下 headless Chrome 与 backend 同容器，localhost:80 没有服务监听；
# 通过 compose 内部 DNS 指向 frontend(nginx) 容器完成截图
app:
  deploy:
    screenshot-host: ${DEPLOY_SCREENSHOT_HOST:http://frontend}
