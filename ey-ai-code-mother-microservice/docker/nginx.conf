server {
    listen       80;
    server_name  localhost;

    # SPA 构建产物目录（镜像内）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain text/xml application/json;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 已部署应用托管：/<deployKey>/...（部署产物经 app_tmp 数据卷共享到容器内）
    # 负向前瞻排除 SPA 与 API 的一级路径，防止 6 字符段（如 assets）被劫持
    location ~ ^/(?!api/|assets/|app/|user/|admin/)([^/]+)/(.*)$ {
        root /usr/share/nginx/tmp/code_deploy;
        try_files /$1/$2 /$1/index.html =404;
    }

    # 部署地址不带尾斜杠时 301 到目录形式（排除带扩展名的根级文件，如 favicon.ico）
    location ~ ^/(?!api/|assets/|app/|user/|admin/)([^/.]+)$ {
        return 301 $uri/;
    }

    # ===== 后端 API 分流已上移至 Higress 网关 =====
    # /api/user/** → user:8124、/api/** → app:8125 均由 Higress 路由（含 SSE 超时）；
    # 本 nginx 不再反代 API，只负责托管 SPA 静态资源与已部署作品。

    # SPA 静态资源缓存（必须排在部署正则之后）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由 - Vue Router history 模式兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
