spring:
  config:
    # 导入项目根目录的 .env（KEY=VALUE 格式，等同 properties）
    # 解决在 IDEA 中直接启动时 ${COS_HOST} 等占位符无法解析的问题
    import:
      - optional:file:./.env[.properties]
  application:
    name: ey-ai-code-user
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_mother
    username: root
    password: 1234
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
server:
  port: 8124
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuluo.eyaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# 关闭自动转换，项目已将实体类字段和数据库字段均采用驼峰命名
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
# Tencent COS 对象存储服务
cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET_NAME}
