services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: code-mother-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: code_mother
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存 & Session
  redis:
    image: redis:7-alpine
    container_name: code-mother-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Java 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-mother-backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 数据库连接指向 Docker 内部服务名
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: code_mother
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis 连接指向 Docker 内部服务名
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8123:8123"
    volumes:
      - app_tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端 Nginx 服务
  frontend:
    build:
      context: ./ey-ai-code-mother-frontend
      dockerfile: Dockerfile
    container_name: code-mother-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  app_tmp:
